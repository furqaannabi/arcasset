# Local Postgres for the backend. Nothing in here is a secret worth protecting —
# these credentials only ever reach a container bound to localhost — but the app
# still reads them from .env so that dev and deploy differ only in configuration.
# Explicit project name. Compose otherwise derives it from the directory, and
# every project on this machine with a backend/ directory would then share one
# namespace — a `compose up` here recreated another project's postgres container
# before this line existed. Volumes survived, but the container did not.
name: arcasset

services:
  postgres:
    image: postgres:17-alpine
    container_name: arcasset-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arcasset
      POSTGRES_PASSWORD: arcasset
      POSTGRES_DB: arcasset
    ports:
      # Bound to loopback explicitly. The default publishes on every interface,
      # which puts a trust-everything database on the coffee shop wifi.
      - "127.0.0.1:5432:5432"
    volumes:
      - arcasset-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Migrations run the moment compose reports healthy, so "accepting
      # connections" has to mean it, not "the process started".
      test: ["CMD-SHELL", "pg_isready -U arcasset -d arcasset"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  arcasset-pgdata:
