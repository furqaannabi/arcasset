[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"

# Pinned, not inferred. An unpinned solc or EVM version means the toolchain
# silently retargets under a contract that is already deployed.
solc_version = "0.8.24"
evm_version = "cancun"

# Arc testnet (5042002) reports blobGasUsed, excessBlobGas and
# parentBeaconBlockRoot on every block, so it is at least Cancun.
# Re-check with `cast block latest` before changing this.

bytecode_hash = "none"
cbor_metadata = false

optimizer = true
optimizer_runs = 200

# Money bugs are the ones that matter here; fail on anything the compiler
# is unsure about rather than discovering it in a test.
deny = "warnings"

[lint]
# Every deadline in this system is measured in minutes to days — acceptance
# windows, grace periods, cure windows, coupon periods. A validator shifting
# block.timestamp by a few seconds cannot move any of them across a boundary
# that matters, and the alternative (block numbers) is worse: block time on Arc
# is not a constant we control, so a schedule denominated in blocks would drift
# against the schedule in the signed agreement.
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[profile.ci]
verbosity = 3
fuzz = {runs = 1024}

[fuzz]
runs = 256
